[project]
name = "community-waste-reporting-ap"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_return_any = false

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -q"
testpaths = ["functions"]

[tool.bandit]
exclude_dirs = ["build", ".venv"]
